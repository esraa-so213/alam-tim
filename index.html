<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tim's Little World</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAF7F2;
            --card-bg: #FFFFFF;
            --card-border: #F3EBDD;
            --text-color: #5C4A3E;
            --text-muted: #8C7A6B;
            --primary-accent: #E89D61;
            --soft-blue: #D0E8F2;
            --soft-beige: #F5EBE6;
            --soft-green: #D8E6D3;
            --soft-yellow: #F9E9BE;
            --soft-pink: #F5D6CE;
            --brown-dark: #4A3E3D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Fredoka', 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        /* Hero Header with Baby Blue Cloud & Bear */
        header {
            background: linear-gradient(180deg, #C2E3F4 0%, #E8F5FC 70%, var(--bg-color) 100%);
            position: relative;
            padding: 40px 20px 50px;
            text-align: center;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
        }

        .header-title {
            font-family: 'Fredoka', cursive;
            font-size: 2.3rem;
            color: var(--brown-dark);
            margin-bottom: 5px;
        }

        .header-subtitle {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .hero-bear-cloud {
            display: inline-block;
            background: #FFFFFF;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(189, 217, 235, 0.5);
            font-size: 3.5rem;
            margin-top: 10px;
            animation: bounce 3s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.6rem;
            color: var(--brown-dark);
            margin: 30px 0 20px;
            font-weight: 700;
        }

        /* Main 2 Cards (Arabic & English) */
        .main-categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        /* Cloud Shaped Card */
        .cloud-card {
            background: var(--card-bg);
            border: 3px solid #F2E8DC;
            border-radius: 40px 15px 40px 15px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(92, 74, 62, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .cloud-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(92, 74, 62, 0.1);
        }

        .card-img-placeholder {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.03);
        }

        .bg-beige-cloud { background-color: var(--soft-beige); }
        .bg-blue-cloud { background-color: var(--soft-blue); }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--brown-dark);
            margin-bottom: 5px;
        }

        .card-sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .btn-explore {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 700;
            color: var(--brown-dark);
            font-size: 0.95rem;
            background: var(--soft-beige);
            padding: 8px 18px;
            border-radius: 20px;
        }

        /* English Folders Grid */
        .grid-folders {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 18px;
            margin-top: 20px;
        }

        .folder-cloud-item {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 30px;
            padding: 22px 15px;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0,0,0,0.02);
        }

        .folder-cloud-item:hover {
            border-color: var(--primary-accent);
            transform: scale(1.03);
        }

        .folder-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .folder-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--brown-dark);
        }

        .folder-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Animals Inside Section */
        .animals-sub-container {
            background: var(--soft-beige);
            border-radius: 30px;
            padding: 25px;
            margin-top: 25px;
        }

        .animals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .animal-card {
            background: #FFFFFF;
            border-radius: 25px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        /* Handwriting Interactive Practice Slider */
        .practice-box {
            background: #FFFFFF;
            border: 3px dashed var(--primary-accent);
            border-radius: 30px;
            padding: 30px 20px;
            text-align: center;
            margin-top: 20px;
        }

        .practice-slide {
            display: none;
        }

        .practice-slide.active {
            display: block;
        }

        .practice-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--brown-dark);
            margin-top: 15px;
        }

        .slider-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn-nav {
            background: var(--primary-accent);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(232, 157, 97, 0.4);
        }

        .btn-nav:disabled {
            background: #D5C9BD;
            box-shadow: none;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
