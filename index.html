
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tim's Little World - My First Words</title>
<style>
:root {
  --cream:#fff9ef;
  --blue:#dceefa;
  --beige:#f2e4cf;
  --pink:#f8e1e4;
  --mint:#e1f0e3;
  --ink:#52616b;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--cream);
  color:var(--ink);
  font-family:Tahoma,Arial,sans-serif;
  line-height:1.7;
}
header {
  text-align:center;
  padding:25px 12px;
  background:linear-gradient(135deg,#fff9ef,#e8f4fb);
}
header .bear { font-size:3rem; }
h1 { color:#54768c; margin:0; font-size:clamp(1.7rem,6vw,2.4rem); }
main { max-width:1000px; margin:auto; padding:16px; }
h2 { color:#54768c; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(135px,1fr));
  gap:13px;
}
.folder {
  border:0;
  border-radius:30px;
  min-height:135px;
  padding:15px 10px;
  background:var(--blue);
  box-shadow:0 4px 0 #c8dfe9;
  color:var(--ink);
  font:inherit;
  cursor:pointer;
}
.folder:nth-child(3n+2) { background:var(--beige); box-shadow:0 4px 0 #e4d3bb; }
.folder:nth-child(3n) { background:var(--pink); box-shadow:0 4px 0 #eccfd3; }
.emoji { display:block; font-size:2.3rem; }
.panel {
  background:white;
  border-radius:24px;
  padding:16px;
  margin-top:18px;
  box-shadow:0 3px 14px #d8d0c555;
}
.hidden { display:none; }
.back,.action {
  border:0;
  border-radius:16px;
  padding:10px 15px;
  background:var(--mint);
  color:var(--ink);
  font:inherit;
  cursor:pointer;
}
.tiles {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
  gap:10px;
}
.tile {
  border:0;
  border-radius:20px;
  padding:12px 8px;
  background:#f7f0e5;
  color:var(--ink);
  font:inherit;
  cursor:pointer;
}
.tile b { display:block; font-size:2rem; }
#message { text-align:center; margin:15px 0; }
footer { text-align:center; padding:24px; color:#75838b; }
</style>
</head>
<body>

<header>
  <div class="bear">🧸 ☁️ 🧸</div>
  <h1>Tim's Little World</h1>
  <p><strong>My First Words</strong></p>
  <p>تمهيد للصغار • نتعلّم • نلعب • نكتشف</p>
</header>

<main>
  <section id="home">
    <h2>اختاري عالمنا الصغير ☁️</h2>
    <div class="grid" id="folders"></div>
  </section>

  <section id="inside" class="panel hidden">
    <button class="back" onclick="goHome()">← الرئيسية</button>
    <h2 id="title"></h2>
    <p id="intro">اضغطي على الصورة لسماع الكلمة.</p>
    <div class="tiles" id="items"></div>
    <p id="message"></p>
  </section>
</main>

<footer>صُمّم بحب لعالم تيم الصغير 🧸</footer>

<script>

    "Animals":[["Cat","🐱","cat"],["Dog","🐶","dog"],["Cow","🐮","cow"],["Lion","🦁","lion"],["Fish","🐟","fish"]],

    "Numbers 1–10":[["One","1️⃣","one"],["Two","2️⃣","two"],["Three","3️⃣","three"],["Four","4️⃣","four"],["Five","5️⃣","five"],["Six","6️⃣","six"],["Seven","7️⃣","seven"],["Eight","8️⃣","eight"],["Nine","9️⃣","nine"],["Ten","🔟","ten"]],
    "Shapes":[["Circle","⚪","circle"],["Square","🟦","square"],["Triangle","🔺","triangle"],["Rectangle","▰","rectangle"],["Star","⭐","star"],["Heart","❤️","heart"]],

  quran: {
    "سورة الناس":[["سورة الناس","📖","سورة الناس"]],
    "سورة الفلق":[["سورة الفلق","📖","سورة الفلق"]],

  },

    "تلوين بسيط":[["دائرة","⚪","دائرة"],["نجمة","⭐","نجمة"]]
  },

    "طابق الصورة":[["قطة","🐱","قطة"],["كلب","🐶","كلب"],["تفاحة","🍎","تفاحة"]],
    "اختار اللون":[["أحمر","🔴","أحمر"],["أصفر","🟡","أصفر"],["أزرق","🔵","أزرق"]],

    "اللطف والمشاركة":[["اللطف والمشاركة","🤝","شارك تيم لعبته مع صديقه، فلعبا معًا بسعادة وتعلّما أن المشاركة تجعل اللعب أجمل."]],
    "ترتيب الألعاب":[["ترتيب الألعاب","🧸","بعد اللعب، جمع الطفل ألعابه ووضع كل لعبة في مكانها. أصبح المكان مرتبًا وجميلًا."]]
  },
  prophets: {
    "النبي محمد ﷺ":[["مولد النبي ﷺ","🕌","وُلد النبي محمد ﷺ في مكة، وعُرف بين قومه بالصدق والأمانة."]],
    "النبي نوح عليه السلام":[["النبي نوح","⛵","دعا النبي نوح عليه السلام قومه إلى عبادة الله، وصبر في دعوته."]],
    "النبي إبراهيم عليه السلام":[["النبي إبراهيم","⭐","كان النبي إبراهيم عليه السلام يدعو قومه إلى عبادة الله وحده."]]
  },
  wudu: {
    "خطوات الوضوء":[["١. غسل اليدين","👐","غسل اليدين"],["٢. المضمضة والاستنشاق","💦","المضمضة والاستنشاق"],["٣. غسل الوجه","😊","غسل الوجه"],["٤. غسل الذراعين","💪","غسل الذراعين"],["٥. مسح الرأس والأذنين","🧕","مسح الرأس والأذنين"],["٦. غسل القدمين","🦶","غسل القدمين"]]
  },

  },
  activities: {
    "نشاط العدّ":[["عدّ التفاحات","🍎 🍎 🍎","عدّ التفاحات"],["عدّ النجوم","⭐ ⭐ ⭐","عدّ النجوم"]],
    "مطابقة الأشكال":[["دائرة ومربع","⚪ 🟦","طابق الشكل مع مثيله"]]
  },
  drawing: {
    "لوحة الرسم":[["ابدأ الرسم","🎨","draw"]]
  },
  montessori: {
    "أنشطة منزلية":[["نقل الحبوب بملعقة","🥄","نشاط بإشراف شخص بالغ، باستخدام أشياء كبيرة وآمنة وغير قابلة للبلع."],["فرز الألوان","🟡 🔵","اطلبي من الطفل تجميع الأشياء حسب اللون."],["مطابقة الأغطية","🫙","استخدمي أغطية كبيرة آمنة وتحت إشراف مباشر."]]
  }
};

const folderArea=document.getElementById("folders");
folders.forEach(([name,emoji,key])=>{
  const b=document.createElement("button");
  b.className="folder";
  b.innerHTML=`<span class="emoji">${emoji}</span>🧸<br>${name}`;
  b.onclick=()=>openFolder(key,name);
  folderArea.appendChild(b);
});

function speak(text,lang){
  if(!("speechSynthesis" in window)){alert(text);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang||"ar-EG";
  speechSynthesis.speak(u);
}
function openFolder(key,name){
  document.getElementById("home").classList.add("hidden");
  document.getElementById("inside").classList.remove("hidden");
  document.getElementById("title").textContent=name;
  document.getElementById("intro").textContent="اختاري القسم اللي تحبي تتعلميه.";
  const area=document.getElementById("items");
  area.innerHTML="";
  const groups=categories[key]||{};
  Object.entries(groups).forEach(([group,entries])=>{
    const b=document.createElement("button");
    b.className="tile";
    b.innerHTML=`<b>🧸</b>${group}`;
    b.onclick=()=>openItems(key,group,entries);
    area.appendChild(b);
  });
  window.scrollTo(0,0);
}
function openItems(key,group,entries){
  const area=document.getElementById("items");
  area.innerHTML="";
  document.getElementById("intro").textContent="اضغطي على الصورة لسماع الكلمة أو القصة.";
  if(Array.isArray(entries) && entries.length && typeof entries[0]==="string"){
    entries=entries.map(letter=>[letter,"🔤",letter]);
  }
  entries.forEach(entry=>{
    const [label,emoji,spoken]=entry;
    const b=document.createElement("button");
    b.className="tile";
    b.innerHTML=`<b>${emoji||"🧸"}</b>${label}`;
    b.onclick=()=>{
      if(key==="drawing"){drawBoard();return;}
      if(key==="quran"){speak(spoken,"ar-EG");return;}
      if(key==="stories"||key==="prophets"||key==="montessori"||key==="wudu"||key==="writing"||key==="activities"){
        document.getElementById("message").textContent=spoken;
        speak(spoken,"ar-EG");
      } else {
        const language=key==="english"?"en-US":"ar-EG";
        speak(spoken||label,language);
      }
    };
    area.appendChild(b);
  });
  window.scrollTo(0,0);
}
function drawBoard(){
  const area=document.getElementById("items");
  area.innerHTML='<p>لوحة رسم بسيطة:</p><canvas id="canvas" width="600" height="350" style="width:100%;border:2px dashed #b8d5e5;border-radius:18px;touch-action:none;background:white"></canvas><button class="action" onclick="clearCanvas()">مسح الرسم</button>';
  const c=document.getElementById("canvas"),ctx=c.getContext("2d");
  let down=false;
  function pos(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};}
  c.onpointerdown=e=>{down=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);c.setPointerCapture(e.pointerId);};
  c.onpointermove=e=>{if(!down)return;const p=pos(e);ctx.lineWidth=5;ctx.lineCap="round";ctx.strokeStyle="#6b9db8";ctx.lineTo(p.x,p.y);ctx.stroke();};
  c.onpointerup=()=>down=false;
  c.onpointercancel=()=>down=false;
}
function clearCanvas(){const c=document.getElementById("canvas");if(c)c.getContext("2d").clearRect(0,0,c.width,c.height);}
function goHome(){
  document.getElementById("home").classList.remove("hidden");
  document.getElementById("inside").classList.add("hidden");
  document.getElementById("message").textContent="";
  window.scrollTo(0,0);
}
</script>
</body>
</html>
